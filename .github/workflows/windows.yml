name: Windows build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
      - name: Configure
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_PREFIX_PATH="$MINGW_PREFIX" -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build/ci --parallel 4
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure
