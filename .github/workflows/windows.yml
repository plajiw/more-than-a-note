name: Windows build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-svg
      - name: Configure, build and test
        run: CMAKE_PREFIX_PATH="$MINGW_PREFIX" cmake --workflow --preset release
      - name: Capture evidence
        run: QT_QPA_PLATFORM=offscreen cmake --build --preset release --target evidence
      - name: Publish evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-windows
          path: build/release/evidence
          if-no-files-found: error
